[project]
name = "youtube-shorts-automator"
version = "0.1.0"
description = "Automated YouTube Shorts pipeline: generates Reddit-style scripts, voiceover, video, and uploads to YouTube."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "gTTS>=2.3.0",
    "moviepy>=1.0.3",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
    "praw>=7.7.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "yt-dlp>=2023.0",
]

[project.scripts]
yt-shorts = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
